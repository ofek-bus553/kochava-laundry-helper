<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>העוזרת של כוכבה - מכונת הכביסה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf6ec; --card:#ffffff; --ink:#2b2118; --soft:#6b5d4f;
    --accent:#0e6e6e; --accent-dark:#0a5454; --accent-soft:#e0f2f1;
    --user:#ffe9c7; --line:#efe3d3; --danger:#b3261e; --danger-soft:#fdecea;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Heebo',Arial,sans-serif; background:var(--bg); color:var(--ink);
    font-size:20px; line-height:1.6; min-height:100vh; display:flex; flex-direction:column;
  }
  header{
    background:linear-gradient(135deg,#0e6e6e,#12857c); color:#fff;
    padding:22px 18px; text-align:center; position:sticky; top:0; z-index:50;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  header h1{font-size:1.5rem; font-weight:900; line-height:1.3;}
  header p{font-size:1.02rem; opacity:.94; margin-top:4px;}
  main{flex:1; width:100%; max-width:760px; margin:0 auto; padding:18px 14px 130px;}
  .hero{
    background:var(--card); border:2px solid var(--line); border-radius:20px;
    padding:20px; text-align:center; margin-bottom:18px;
  }
  .hero .wave{font-size:2.6rem;}
  .hero h2{font-size:1.35rem; font-weight:700; margin:6px 0 4px;}
  .hero p{color:var(--soft); font-size:1.05rem;}
  #chat{margin-top:8px;}
  .msg{display:flex; margin:14px 0; animation:pop .25s ease;}
  @keyframes pop{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  .bubble{
    max-width:92%; padding:14px 18px; border-radius:18px; font-size:1.12rem; line-height:1.65;
  }
  .msg.bot{justify-content:flex-start;}
  .msg.bot .bubble{
    background:var(--card); border:2px solid var(--line); border-start-start-radius:4px;
  }
  .msg.user{justify-content:flex-end;}
  .msg.user .bubble{
    background:var(--user); border:2px solid #f0d5a8; border-start-end-radius:4px; font-weight:500;
  }
  .bubble h3{font-size:1.18rem; color:var(--accent-dark); margin-bottom:8px; font-weight:900;}
  .bubble ol, .bubble ul{padding-inline-start:26px; margin:6px 0;}
  .bubble li{margin:7px 0;}
  .bubble .note{
    background:var(--accent-soft); border-radius:12px; padding:10px 14px; margin-top:10px; font-size:1.02rem;
  }
  .bubble .warn{
    background:var(--danger-soft); color:var(--danger); border-radius:12px; padding:10px 14px; margin-top:10px; font-weight:700;
  }
  .bubble .svc{
    display:inline-block; margin-top:10px; background:var(--accent); color:#fff; font-weight:900;
    padding:10px 20px; border-radius:14px; font-size:1.25rem; letter-spacing:.5px; text-decoration:none;
  }
  .bubble table{width:100%; border-collapse:collapse; margin-top:8px; font-size:1.02rem;}
  .bubble td{border:1px solid var(--line); padding:8px 10px; vertical-align:top;}
  .bubble td:first-child{font-weight:700; white-space:nowrap; background:#fbf7ef;}
  .chips-title{
    text-align:center; font-weight:700; color:var(--soft); margin:22px 0 10px; font-size:1.08rem;
  }
  .chips{display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
  .chip{
    font-family:inherit; font-size:1.1rem; font-weight:700; cursor:pointer;
    background:var(--card); color:var(--accent-dark); border:2.5px solid var(--accent);
    border-radius:999px; padding:13px 20px; min-height:56px;
    transition:transform .1s, background .15s;
  }
  .chip:hover{background:var(--accent-soft);}
  .chip:active{transform:scale(.96);}
  .chip.hot{background:var(--danger-soft); border-color:var(--danger); color:var(--danger);}
  .ask{
    position:fixed; bottom:0; left:0; right:0; background:#fff;
    border-top:2px solid var(--line); padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  }
  .ask-inner{max-width:760px; margin:0 auto; display:flex; gap:10px;}
  #q{
    flex:1; font-family:inherit; font-size:1.15rem; padding:14px 18px; min-height:58px;
    border:2.5px solid var(--accent); border-radius:16px; background:#fff; color:var(--ink);
  }
  #q::placeholder{color:#a8998a;}
  #go{
    font-family:inherit; font-size:1.15rem; font-weight:900; cursor:pointer;
    background:var(--accent); color:#fff; border:none; border-radius:16px; padding:0 26px; min-height:58px;
  }
  #go:active{background:var(--accent-dark);}
  .typing{display:flex; gap:5px; padding:6px 2px;}
  .typing i{width:9px; height:9px; border-radius:50%; background:#b6a894; animation:b 1s infinite;}
  .typing i:nth-child(2){animation-delay:.15s;} .typing i:nth-child(3){animation-delay:.3s;}
  @keyframes b{0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);}}
  footer{
    text-align:center; color:var(--soft); font-size:.95rem; padding:16px;
  }
  @media (max-width:480px){
    body{font-size:19px;}
    header h1{font-size:1.28rem;}
    .bubble{font-size:1.08rem; max-width:96%;}
  }
</style>
</head>
<body>
<header>
  <h1>🧺 העוזרת של כוכבה</h1>
  <p>כל התשובות על מכונת הכביסה החדשה שלך (Siemens WM12N221IL)</p>
</header>
<main>
  <div class="hero">
    <div class="wave">👋🌸</div>
    <h2>שלום כוכבה! אני כאן לעזור</h2>
    <p>לחצי על שאלה מהרשימה, או כתבי שאלה משלך למטה.</p>
  </div>
  <div id="chat"></div>
  <div class="chips-title">⚠️ משהו לא עובד?</div>
  <div class="chips" id="hotchips"></div>
  <div class="chips-title">שאלות נפוצות</div>
  <div class="chips" id="chips"></div>
</main>
<div class="ask">
  <div class="ask-inner">
    <input id="q" type="text" placeholder="כתבי כאן שאלה... למשל: איפה שמים אבקה?" autocomplete="off">
    <button id="go" type="button">שאלי</button>
  </div>
</div>
<footer>
  התשובות מבוססות על המדריך הרשמי של סימנס לדגם WM12N221IL · שירות לקוחות סימנס: *2220
</footer>
<script src="app.js"></script>
</body>
</html>
